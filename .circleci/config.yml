version: 2.1

jobs:
  test:
    docker:
      - image: nixos/nix:latest
    resource_class: medium
    steps:
      - run:
          name: Fix git ownership
          command: git config --global --add safe.directory '*'
      - checkout
      - run:
          name: Configure Nix
          command: |
            mkdir -p ~/.config/nix
            echo "experimental-features = nix-command flakes" > ~/.config/nix/nix.conf
      - run:
          name: Format Check
          command: nix develop --command cargo fmt --all --check
      - run:
          name: Lint Check
          command: nix develop --command cargo check
      - setup_remote_docker:
          version: default
          docker_layer_caching: true
      - run:
          name: Start services with Docker Compose
          command: docker compose up db localstack -d
      - run:
          name: Wait for services to be ready
          command: |
            echo "Waiting for services to start..."
            timeout 60 bash -c 'until echo > /dev/tcp/localhost/5432; do sleep 5; done'
            timeout 60 bash -c 'until echo > /dev/tcp/localhost/4566; do sleep 5; done'
      - run:
          name: Migrate db
          command: |
            echo "Creating database..."
            docker compose exec -T db psql -U user -d postgres -c "CREATE DATABASE test_habit_market;"
            nix develop --command fw test_habit_market migrate
      - run:
          name: Run tests
          command: nix develop --command bash -c t

