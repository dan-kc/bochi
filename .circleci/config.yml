version: 2.1

jobs:
  test:
    docker:
      - image: cimg/base:2025.10
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install & Configure Nix
          command: |
            sh <(curl -L https://nixos.org/nix/install) --no-daemon
            mkdir -p ~/.config/nix
            echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
            echo 'export USER=${USER:-circleci}' >> $BASH_ENV
            echo '. $HOME/.nix-profile/etc/profile.d/nix.sh' >> $BASH_ENV
      - run:
          name: Format Check
          command: |
            export USER=${USER:-circleci}
            . /home/circleci/.nix-profile/etc/profile.d/nix.sh
            nix develop --command cargo fmt --all --check
      - run:
          name: Lint Check
          command: |
            export USER=${USER:-circleci}
            . /home/circleci/.nix-profile/etc/profile.d/nix.sh
            nix develop --command cargo check
      - run:
          name: Start Services
          command: |
            export USER=${USER:-circleci}
            . /home/circleci/.nix-profile/etc/profile.d/nix.sh
            nix develop --command start
      - run:
          name: Run Migrations
          command: |
            export USER=${USER:-circleci}
            . /home/circleci/.nix-profile/etc/profile.d/nix.sh
            nix develop --command fw test_habit_market migrate
      - run:
          name: Run Tests
          command: |
            export USER=${USER:-circleci}
            . /home/circleci/.nix-profile/etc/profile.d/nix.sh
            nix develop --command t

