name: "Test"
on:
  pull_request:
  push:
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      CI_ENVIRONMENT: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # - name: Start LocalStack
      #   uses: LocalStack/setup-localstack@v0.2.3
      #   with:
      #     image-tag: 'latest'
      #     install-awslocal: 'true'

      # - name: Initialise LocalStack
      #   run: ./init-aws.sh

      - name: Start services with Docker Compose
        run: docker compose up db localstack -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          timeout 60 bash -c 'until echo > /dev/tcp/localhost/8080; do sleep 5; done'
          timeout 60 bash -c 'until echo > /dev/tcp/localhost/4566; do sleep 5; done'
          docker compose ps

      - run: nix develop --command nix flake check
