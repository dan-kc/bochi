name: "CI"
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "migrations/**"
      - ".github/workflows/ci.yml"

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      migrations_changed: ${{ steps.check_files.outputs.migrations_changed }}
      src_changed: ${{ steps.check_files.outputs.src_changed }}
      workflow_changed: ${{ steps.check_files.outputs.workflow_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine base commit for diff
        id: base_commit
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "GIT_REF_BEFORE=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # For pull_request event, compare with the base branch
            echo "GIT_REF_BEFORE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Check for file changes
        id: check_files
        run: |
          GIT_REF_BEFORE="${{ steps.base_commit.outputs.GIT_REF_BEFORE }}"
          CURRENT_SHA="${{ github.sha }}"

          # Check migrations/
          if git diff --exit-code $GIT_REF_BEFORE..$CURRENT_SHA -- migrations/ ; then
            echo "No changes in migrations/ detected."
            echo "migrations_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes in migrations/ detected!"
            echo "migrations_changed=true" >> "$GITHUB_OUTPUT"
          fi

          # Check src/
          if git diff --exit-code $GIT_REF_BEFORE..$CURRENT_SHA -- src/ ; then
            echo "No changes in src/ detected."
            echo "src_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes in src/ detected!"
            echo "src_changed=true" >> "$GITHUB_OUTPUT"
          fi

          # Check .github/workflows/ci.yml
          if git diff --exit-code $GIT_REF_BEFORE..$CURRENT_SHA -- .github/workflows/ci.yml ; then
            echo "No changes in .github/workflows/ci.yml detected."
            echo "workflow_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes in .github/workflows/ci.yml detected!"
            echo "workflow_changed=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  test:
    runs-on: ubuntu-latest
    needs: [check_changes]
    if: needs.check_changes.outputs.src_changed == 'true' || needs.check_changes.outputs.src_changed == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Format Check
        run: nix develop --command cargo fmt --all --check

      - name: Lint Check
        run: nix develop --command cargo check

      - name: Start services with Docker Compose
        run: docker compose up db localstack -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          timeout 60 bash -c 'until echo > /dev/tcp/localhost/5432; do sleep 5; done'
          timeout 60 bash -c 'until echo > /dev/tcp/localhost/4566; do sleep 5; done'

      - name: Migrate db
        run: |
          echo "Creating database..."
          docker compose exec -T db psql -U user -d postgres -c "CREATE DATABASE test_habit_market;"
          nix develop --command fw test_habit_market migrate

      - name: Run tests
        run: |
          nix develop --command bash -c t

  build:
    runs-on: ubuntu-latest
    needs: [check_changes, test]
    if: needs.check_changes.outputs.src_changed == 'true' 
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS Credentials with OIDC Role
        uses: aws-actions/configure-aws-credentials@v4.0.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR repository URI
        id: get-repository-uri
        run: |
          ECR_URI=$(aws ecr describe-repositories --repository-names habit-market-backend --query "repositories[0].repositoryUri" --output text)
          echo "ECR_URI=$ECR_URI" >> $GITHUB_OUTPUT
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          nix develop --command nix build .#server-docker

      - name: Load image and tag for ECR
        run: |
          docker load --input ./result

          IMAGE_NAME="habit-market-backend" 
          ECR_REPOSITORY_URI="${{ steps.get-repository-uri.outputs.ECR_URI }}"
          IMAGE_TAG="latest"
          VERSION_TAG="${GITHUB_SHA::7}"
          docker tag ${IMAGE_NAME} "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          docker tag ${IMAGE_NAME} "${ECR_REPOSITORY_URI}:${VERSION_TAG}"

      - name: Push image to Amazon ECR
        run: |
          ECR_REPOSITORY_URI="${{ steps.get-repository-uri.outputs.ECR_URI }}"
          IMAGE_TAG="latest"
          VERSION_TAG="${GITHUB_SHA::7}"
          docker push "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          docker push "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"

  migrate:
    runs-on: ubuntu-latest
    needs: [check_changes, test]
    if: steps.check_files.outputs.migrations_changed == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS Credentials with OIDC Role
        uses: aws-actions/configure-aws-credentials@v4.0.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

