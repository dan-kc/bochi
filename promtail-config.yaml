server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: app
    static_configs:
      - targets:
          - localhost
        labels:
          job: habit-market
          __path__: /var/log/app/server.log*
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            request_id: request_id
            method: method
            uri: uri
            status: status
            duration: duration
            error: error
      - labels:
          level:
          method:
          status:
      - timestamp:
          source: timestamp
          format: RFC3339