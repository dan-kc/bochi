services:
  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d habit_market"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  localstack:
    healthcheck:
      test: [
          "CMD-SHELL",
          # Use the last secret added so that server waits until then.
          "awslocal secretsmanager get-secret-value --secret-id eddsa-private-key --region eu-west-1 > /dev/null 2>&1
          ",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    image: habit-market-server:latest
    environment:
      AWS_ENDPOINT_URL_SECRETSMANAGER: http://localstack:4566
      AWS_SECRETS_PREFIX:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
      RUST_BACKTRACE: 1
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  data:
