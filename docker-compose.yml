services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: habit_market
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4.7
    environment:
      POSTGRES_DB: habit_market
      SERVICES: secretsmanager,sts
      DEBUG: 0
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    volumes:
      - ./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080



volumes:
  data:
