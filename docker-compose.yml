services:
  server:
    image: habit-market-backend:latest
    container_name: habit-market-backend
    network_mode: host
    environment:
      DB_USER: "user"
      DB_PASSWORD: "password"
      DB_HOST: "localhost"
      DB_NAME: "habit_market"
      SSL_MODE: "disable"
      JWT_PRIVATE_KEY: |
        -----BEGIN PRIVATE KEY-----
        MC4CAQAwBQYDK2VwBCIEIL9ijTozRgbWNk4WlZosj9MibQ9s8gwcEOqk0KxQxxGd
        -----END PRIVATE KEY-----
      JWT_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MCowBQYDK2VwAyEAgqOy39tZbw5kBo7F7+BIJfcemdiIbQhirZW4NV8lC2I=
        -----END PUBLIC KEY-----
      LOG_DESTINATION: "logs"
      RUST_LOG: "info"
    restart: unless-stopped
